# Company universe for this project (US large-caps, per the Phase 2 pivot
# in LOG.md — was Indian companies + manual PDF sourcing, switched to
# SEC EDGAR for reliable, scriptable filing retrieval).
#
# `cik` is left null here deliberately: ingestion/download_filings.py
# resolves ticker -> CIK at runtime via SEC's own
# www.sec.gov/files/company_tickers.json, rather than hardcoding CIK
# numbers by hand and risking a wrong digit. This file is the source of
# truth for *which* companies are in scope, not their SEC identifiers.

